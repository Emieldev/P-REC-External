// ====================================================================
// P-REC External (v1.0.0)
// ====================================================================
// ⚠️ 100% Vibecoded Application — Use at your own risk.
// ====================================================================
// This configures P-REC External settings, demo handling, league rulesets, and alerts.
// Works seamlessly with 64-bit TF2, mastercomfig, and m0rehud.
// 
// Steam Launch Option:
// -usercon +rcon_password <password> +ip 0.0.0.0 +hostport 27969 +net_start
// ====================================================================

// Engine Compatibility Aliases (Suppresses "Unknown command" console warnings)
alias prec_version             ""
alias prec_league              ""
alias prec_mode                ""
alias prec_dir                 ""
alias prec_sound               ""
alias prec_hide_to_tray        ""
alias prec_desktop_shortcut    ""
alias prec_screens             ""
alias prec_notify              ""
alias prec_min_streak          ""
alias prec_kill_delay          ""
alias prec_log                 ""
alias prec_delete_useless_demo ""
alias prec_stv_status          ""
alias prec_tag                 ""
alias prec_connection_mode     ""
alias prec_rcon_port           ""
alias prec_rcon_password       ""
alias prec_netcon_port         ""
alias prec_tf_path             ""

// Application Version
prec_version             "1.0.0"

// League Ruleset Profile
// Options: "etf2l" (default), "asiafortress", "rgl", "ozfortress", "matcha", "cltf2", "custom"
// Or any custom profile defined in leagues/<id>.json
// - "etf2l": Strict ETF2L Rule 2.1 compliance (auto status screenshot with SteamIDs,
//            ds_autodelete 0, records strictly when match goes live, mid-match reconnect recovery)
// - "asiafortress": AsiaFortress Cup & League rules compliance (POV recording, af_ configs, status screenshot)
// - "rgl": Strict RGL 1008.5 compliance (POV demo mandatory, ds_autodelete 0, RGL config triggers)
// - "ozfortress": Complies with ozfortress Demo Checker plugin (sm_querycvar checks ds_enable & ds_autodelete)
// - "matcha": Matcha.tf ruleset compliance (Asia/Pacific league, mandatory POV recording, random demo checks)
// - "cltf2": CustomLander TF2 Rule 3.3 compliance (4v4, Ultiduo, Highlander, mandatory POV recording)
// - "custom": Custom user triggers
prec_league              "etf2l"

// Recording Modes & Triggers
prec_mode                2      // 0=disabled, 1=custom named only, 2=record active tournament matches only, 3=record all matches
prec_dir                 "demos"// Subfolder inside /tf/ where recorded demos are stored
prec_sound               1      // 1=Play audio cue on recording start/stop, 0=mute
prec_hide_to_tray        1      // 1=Hide console window to system tray (hidden pictograms), 0=keep console visible
prec_desktop_shortcut    1      // 1=Ensure desktop shortcut exists, 0=off
prec_screens             1      // 1=Take screenshot of status & scoreboard at end of round (required by leagues), 0=off
prec_notify              1      // 0=console only, 1=start/stop message in team chat, 2=hud notification

// Killstreak & Log Settings
prec_min_streak          3      // Minimum kills for a killstreak to get logged
prec_kill_delay          15     // Maximum time in seconds between kills to count towards a streak
prec_log                 0      // 0=no logging, 1=killstreaks.txt, 2=killstreak file per demo, 3=killstreak file per map
prec_delete_useless_demo 0      // 0=never delete (CRITICAL for league compliance), 1=delete demos without bookmarks
prec_stv_status          1      // Show STV status in status screenshot
prec_tag                 ""     // Custom prefix tag for demo names (leave "" for league default prefix)

// Chat Announcements (Configurable)
alias pr_message_start "say_team [P-REC] Recording started."
alias pr_message_stop  "say_team [P-REC] Stop recording."
alias pr_message_mark  "say_team [P-REC] Bookmark placed."

// Connection Configuration for P-REC External Companion
// "rcon" shares DemoMan's existing port 27969 (+ requires -condebug to read console.log)
// "auto" auto-detects DemoMan or configured RCON port
prec_connection_mode     "auto"
prec_rcon_port           27969
rcon_password            ""      // Sets TF2's in-game cvar (leave empty for auto-generation/DemoMan detection)
prec_rcon_password       ""      // Leave empty ("") to auto-detect DemoMan or auto-generate secure password on first run
prec_netcon_port         2121

// Whitelist localhost from TF2 RCON flood protection and clear any temporary session IP ban
sv_rcon_whitelist_address "127.0.0.1"
removeip 127.0.0.1
con_logfile "console.log"

// TF2 Directory (optional if installed in standard Steam location)
// Leave empty ("") to auto-detect Steam TF2 path, or set absolute path:
// e.g. "C:/Program Files (x86)/Steam/steamapps/common/Team Fortress 2/tf"
prec_tf_path             ""
