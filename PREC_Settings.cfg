// ====================================================================
// P-REC External — Settings & Configuration
// ====================================================================
// High-performance automated match recorder for Team Fortress 2 (64-bit).
// Works seamlessly with mastercomfig, m0rehud, and DemoMan.
//
// Recommended Steam Launch Options:
//   -usercon +rcon_password <password> +ip 0.0.0.0 +hostport 27969 +net_start
// ====================================================================

// --------------------------------------------------------------------
// Engine Compatibility Aliases (Suppresses console warnings in TF2)
// --------------------------------------------------------------------
alias prec_league                ""
alias prec_mode                  ""
alias prec_dir                   ""
alias prec_sound                 ""
alias prec_screens               ""
alias prec_status                ""
alias prec_screenshot            ""
alias prec_notify                ""
alias prec_tag                   ""
alias prec_demo_name             ""
alias prec_min_streak            ""
alias prec_kill_delay            ""
alias prec_log                   ""
alias prec_server_rcon_passwords ""

// --------------------------------------------------------------------
// 1. League Ruleset Profile
// --------------------------------------------------------------------
// Available Profiles:
//   - "etf2l"        : European TF2 League (Strict Rule 2.1 compliance: random
//                      status screenshot after 3 mins of play, ds_autodelete 0,
//                      auto-resumes on mid-match reconnect, records on match live)
//   - "rgl"          : RGL.gg North American League (Rule 1008.5 compliance,
//                      POV demo mandatory, ds_autodelete 0, RGL config triggers)
//   - "ozfortress"   : Oceanic TF2 League (Complies with ozfortress Demo Checker)
//   - "asiafortress" : AsiaFortress Cup & League (af_ configs, mandatory POV recording)
//   - "matcha"       : Matcha.tf Asia/Pacific League (Automated match live triggers)
//   - "cltf2"        : CustomLander TF2 (4v4, Ultiduo, Highlander compliance)
//   - "custom"       : Custom user triggers (defined in leagues/custom.json)
prec_league                "etf2l"

// --------------------------------------------------------------------
// 2. Recording Mode
// --------------------------------------------------------------------
// Modes:
//   3 = Record ALL matches (every map, round, and server automatically)
//   2 = Record tournament matches only (Auto-records when match goes LIVE - Default)
//   1 = Manual recording only (records on custom triggers/manual start)
//   0 = Disabled (turns off all demo recording)
prec_mode                  2

// --------------------------------------------------------------------
// 3. Demo Storage & Alerts
// --------------------------------------------------------------------
// Subfolder inside /tf/ where recorded demos are stored
prec_dir                   "demos"

// Audio cue on recording start / stop (1 = on, 0 = mute)
prec_sound                 1

// Screenshot capture (1 = on, 0 = off)
// Takes mandatory status screenshot after 3 mins of play & match-end scoreboard
prec_screens               1

// In-game announcements (1 = team chat start/stop message, 0 = console only)
prec_notify                1

// --------------------------------------------------------------------
// 4. Demo Naming Pattern
// --------------------------------------------------------------------
// Supported Tokens:
//   %date%   - Date (YYYYMMDD, e.g. 20261104)
//   %time%   - Time (HHMM, e.g. 2145)
//   %map%    - Map name (e.g. cp_steel_f12, cp_process_f12)
//   %red%    - Tournament Red team name
//   %blu%    - Tournament Blu team name
//   %league% - Active league profile (e.g. etf2l)
//   %tag%    - Custom prefix tag from prec_tag
prec_tag                   ""
prec_demo_name             "%date%_%time%_%map%_%red%_%blu%"

// --------------------------------------------------------------------
// 5. Team Chat Messages (Configurable)
// --------------------------------------------------------------------
alias pr_message_start "say_team [P-REC] Recording started."
alias pr_message_stop  "say_team [P-REC] Stop recording."
alias pr_message_mark  "say_team [P-REC] Bookmark placed."

// --------------------------------------------------------------------
// 6. Killstreaks & Bookmarks (Optional)
// --------------------------------------------------------------------
prec_min_streak            3      // Minimum kills for killstreak logging
prec_kill_delay            15     // Max seconds between kills to maintain streak
prec_log                   0      // 0 = off, 1 = log killstreaks to killstreaks.txt

// --------------------------------------------------------------------
// 7. Server RCON / serveme.tf Synergy (Optional)
// --------------------------------------------------------------------
// List any remote server RCON passwords here (comma-separated):
// P-REC automatically synchronizes and auto-heals when executing remote server commands.
prec_server_rcon_passwords ""

// Whitelist localhost from Source engine RCON flood protection
sv_rcon_whitelist_address "127.0.0.1"
removeip 127.0.0.1
